name: PACES Ward live client smoke test
on:
  push:
    branches:
      - Movie-date
      - 'repair-client-demo-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/live-smoke.mjs
