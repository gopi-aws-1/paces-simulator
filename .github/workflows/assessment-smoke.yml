name: Live consultant feedback smoke test
on:
  push:
    branches:
      - 'audit-student-flow-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assessment:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/assessment-smoke.mjs
